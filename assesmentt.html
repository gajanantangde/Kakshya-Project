
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Stream Predictor</title>
  <style>
    *{
      padding: 0%;
      margin: 0%;
      box-sizing: border-box;
    }
    /* Styles remain unchanged */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: auto;
      max-height: 100vh;
      background-color:  white ;
      
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 70px;
      background-color: #4da6ffcd;
      /* background: linear-gradient(to right, #d257ff,#5765ff,#bc36ff); */
      /* background: linear-gradient(to left, #4668ff, #e357ff, rgb(255, 192, 76)); */

      color: black;
      text-align: center;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px 0;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
      font-size: 1.5rem;
    }

    .container {
      max-width: 600px;
      margin: 200px auto 20px;
      background-color:  #4da6ffcd;
      border-radius: 15px;
      box-shadow: 8px 8px 15px rgba(0, 0, 0, 0.5);
      padding: 20px;
      text-align: center;
      overflow: hidden;
    }

    .question-number {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .question-number span {
      background: #ddd;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 5px;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s, color 0.3s;
    }

    .question-number span.active {
      background: #007bff;
      color: white;
    }

    .question-number span.completed {
      background: #28a745;
      color: white;
    }

    .question {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .options {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }

    .options label {
      display: flex;
      align-items: center;
      font-size: 1rem;
      cursor: pointer;
      padding: 10px;
      border: 2px solid transparent;
      border-radius: 8px;
      transition: background-color 0.3s, border-color 0.3s, transform 0.2s ease-in-out;
    }

    .options label:hover {
      background-color: rgba(255, 255, 255, 0.2);
      border-color: #fff;
      transform: scale(1.05);
    }

    .options input[type="radio"] {
      appearance: none;
      width: 20px;
      height: 20px;
      margin-right: 10px;
      border: 2px solid #fff;
      border-radius: 50%;
      outline: none;
      cursor: pointer;
      transition: background-color 0.3s, transform 0.2s ease-in-out;
    }

    .options input[type="radio"]:hover {
      transform: scale(1.1);
    }

    .options input[type="radio"]:checked {
      background-color: #007bff;
      border-color: #ffffff;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .navigation button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .navigation button:disabled {
      background-color: #ddd;
      cursor: not-allowed;
    }

    .navigation button:hover:not(:disabled) {
      background-color: #0056b3;
    }
    #resultContainer{
        max-width: 600px;
      margin: 500px auto 20px;
      background-color:  #4da6ffcd;
      border-radius: 15px;
      box-shadow: 8px 8px 15px rgba(0, 0, 0, 0.5);
      padding: 20px;
      text-align: center;
      overflow: hidden;
    }
    
  </style>
</head>
<body>
  <div class="header"><h1>Career Counseling Quiz</h1></div>
  <div class="container">
    <div class="question-number" id="questionNumbers"></div>

    <div class="question-container" id="questionContainer"></div>

    <div class="navigation">
      <button id="prev" disabled>Previous</button>
      <button id="submit" disabled>Submit</button>

      <button id="next" disabled>Next</button>
      <button id="submit" style="display: none;">Submit</button>
    
    </div>
  </div>
  <div id="resultContainer" style="display: none; text-align: center; margin-top: 100px;">
    <h2>Suggested top 3 Streams Based on your answers are:</h2>
    <ol id="resultList" style="list-style: decimal; margin: 20px auto; padding: 0; max-width: 300px; text-align: left;"></ol>
  </div>
  
  <div id="resultContainer" style="display: none;">
    <h2>Your Career Suggestions:</h2>
    <ul id="resultList" style="list-style: decimal; margin: 20px auto; padding: 0; max-width: 300px; text-align: left;"></ul>
  </div>


  <script>
    const questions = [
    { text: "Do you enjoy solving complex problems?", options: ["Yes, I love solving problems.", "Not much, I prefer easier tasks."] },
      { text: "Are you interested in human health and medicine?", options: ["Yes, I am passionate about healthcare.", "No, I'm not interested in healthcare."] },
      { text: "Do you have an interest in coding and programming?", options: ["Yes, I love programming and coding.", "No, I prefer other things."] },
      { text: "Do you enjoy working with numbers and finance?", options: ["Yes, I enjoy finance and managing numbers.", "No, I'm more inclined towards creative fields."] },
      { text: "Do you like to create and design things?", options: ["Yes, I love creating and designing.", "Not really, I prefer more analytical tasks."] },
      { text: "Are you interested in teaching and sharing knowledge?", options: ["Yes, I enjoy teaching and helping others learn.", "No, I prefer working on other things."] },
      { text: "Do you enjoy working in groups and managing people?", options: ["Yes, I like leadership roles.", "No, I prefer working independently."] },
      { text: "Are you interested in environmental protection and sustainability?", options: ["Yes, I am passionate about the environment.", "No, I am not interested in environmental topics."] },
      { text: "Do you enjoy managing and organizing events?", options: ["Yes, I enjoy event management.", "No, I prefer more technical work."] },
      { text: "Are you interested in social work and helping others?", options: ["Yes, I am passionate about helping others.", "No, I prefer other fields."] },
      { text: "Do you like managing data and making informed decisions?", options: ["Yes, I enjoy working with data.", "No, I prefer more creative tasks."] },
      { text: "Are you passionate about space and aviation?", options: ["Yes, I am fascinated by space.", "No, I prefer other industries."] },
      { text: "Do you enjoy hands-on work with machines or tools?", options: ["Yes, I like working with machines.", "No, I prefer other things."] },
      { text: "Are you interested in designing websites and applications?", options: ["Yes, I like building websites and apps.", "No, I am more interested in management."] },
      { text: "Do you prefer working with numbers or abstract concepts?", options: ["Yes, I love working with numbers.", "No, I prefer abstract and creative work."] },
      { text: "Are you interested in law and legal systems?", options: ["Yes, I want to study law.", "No, I prefer other fields."] },
      { text: "Do you like working with children and education?", options: ["Yes, I want to teach and help children.", "No, I prefer other work environments."] },
      { text: "Do you enjoy working in teams and leading projects?", options: ["Yes, I like to lead projects.", "No, I prefer working on my own."] },
      { text: "Are you interested in building and designing buildings?", options: ["Yes, I enjoy working with architecture and construction.", "No, I prefer working in other areas."] },
      { text: "Do you have a passion for teaching and inspiring others?", options: ["Yes, I love to teach.", "No, I prefer other fields."] },
      { text: "Are you interested in the entertainment and media industry?", options: ["Yes, I enjoy media and entertainment.", "No, I prefer other areas."] },
      { text: "Are you passionate about travel and tourism?", options: ["Yes, I love traveling and hospitality.", "No, I prefer working in other fields."] },
      { text: "Do you enjoy working with animals?", options: ["Yes, I love animals and healthcare.", "No, I prefer other industries."] },
      { text: "Are you interested in creating new products or inventions?", options: ["Yes, I like innovation and product creation.", "No, I prefer other tasks."] },
      { text: "Do you like working with technology and gadgets?", options: ["Yes, I enjoy working with technology.", "No, I am more interested in healthcare."] },
    ];

    const questionContainer = document.getElementById("questionContainer");
    const questionNumbers = document.getElementById("questionNumbers");
    const nextBtn = document.getElementById("next");
    const prevBtn = document.getElementById("prev");
    // const submitBtn = document.getElementById("submit");
    // const resultContainer = document.getElementById("resultContainer");
    // const resultList = document.getElementById("resultList");

    let currentQuestionIndex = 0;

    function renderQuestions() {
      questionContainer.innerHTML = questions
        .map(
          (q, index) => `
          <div class="question" style="display: ${index === 0 ? "block" : "none"};">
            ${index + 1}. ${q.text}
            <div class="options">
              ${q.options
                .map(
                  (opt) => `
                <label>
                  <input type="radio" name="q${index + 1}" value="${opt}">
                  ${opt}
                </label>
              `
                )
                .join("")}
            </div>
          </div>
        `
        )
        .join("");

      questionNumbers.innerHTML = questions
        .map(
          (_, index) => `
          <span class="${index === 0 ? "active" : ""}" data-index="${index}">${index + 1}</span>
        `
        )
        .join("");
    }

    function updateQuestion(index) {
      const allQuestions = document.querySelectorAll(".question");
      const allQuestionNumbers = document.querySelectorAll(".question-number span");

      allQuestions.forEach((q, i) => {
        q.style.display = i === index ? "block" : "none";
      });

      allQuestionNumbers.forEach((num, i) => {
        num.classList.toggle("active", i === index);
        if (document.querySelector(`input[name="q${i + 1}"]:checked`)) {
          num.classList.add("completed");
        } else {
          num.classList.remove("completed");
        }
      });

      prevBtn.disabled = index === 0;
      nextBtn.style.display = index === questions.length - 1 ? "none" : "inline-block";
      submitBtn.style.display = index === questions.length - 1 ? "inline-block" : "none";
    }

    function calculateResults() {
      const responses = [];
      questions.forEach((_, index) => {
        const selectedOption = document.querySelector(`input[name="q${index + 1}"]:checked`);
        if (selectedOption) {
          responses.push(selectedOption.value);
        }
      });

      const careerSuggestions = [
        "Engineering",
        "Medicine",
        "Law",
        "Business",
        "Arts"
      ];

      const scores = careerSuggestions.map((_, i) => Math.floor(Math.random() * 100));
      const sortedSuggestions = careerSuggestions
        .map((career, i) => ({ career, score: scores[i] }))
        .sort((a, b) => b.score - a.score);

      return sortedSuggestions.slice(0, 3);
    }

    nextBtn.addEventListener("click", () => {
      if (currentQuestionIndex < questions.length - 1) {
        currentQuestionIndex++;
        updateQuestion(currentQuestionIndex);
      }
    });

    prevBtn.addEventListener("click", () => {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        updateQuestion(currentQuestionIndex);
      }
    });

const submitBtn = document.getElementById("submit");
const resultContainer = document.getElementById("resultContainer");
const resultList = document.getElementById("resultList");

// Example scoring system (You can adjust this based on your logic)
const careerScores = {
  "Law": 0,
  "Engineering & Technology": 0,
  "Business Management": 0,
  "Healthcare": 0,
  "Teaching": 0
};

// Logic to calculate scores
function calculateScores() {
  const allAnswers = document.querySelectorAll('input[type="radio"]:checked');
  allAnswers.forEach((answer, index) => {
    // Add logic to update scores for career streams
    if (index % 5 === 0) careerScores["Law"] += 1;
    if (index % 5 === 1) careerScores["Engineering & Technology"] += 1;
    if (index % 5 === 2) careerScores["Business Management"] += 1;
    if (index % 5 === 3) careerScores["Healthcare"] += 1;
    if (index % 5 === 4) careerScores["Teaching"] += 1;
  });
}

// Logic to show the results
function displayResults() {
  calculateScores();
  // Sort the career scores in descending order
  const sortedCareers = Object.entries(careerScores).sort((a, b) => b[1] - a[1]);
  
  // Display the top 3 careers
  resultList.innerHTML = sortedCareers
    .slice(0, 3)
    .map((career) => `<li>${career[0]}</li>`)
    .join("");

  // Show the result container and hide the quiz
  document.querySelector(".container").style.display = "none";
  resultContainer.style.display = "block";
}

// Enable the submit button when all questions are answered
document.addEventListener("change", () => {
  const allQuestionsAnswered = document.querySelectorAll('input[type="radio"]:checked').length === questions.length;
  submitBtn.disabled = !allQuestionsAnswered;
});

// Event listener for the submit button
submitBtn.addEventListener("click", displayResults);


    submitBtn.addEventListener("click", () => {
      const topSuggestions = calculateResults();
      resultContainer.style.display = "block";
      resultList.innerHTML = topSuggestions
        .map((s) => `<li>${s.career} (Score: ${s.score})</li>`)
        .join("");
      document.querySelector(".container").style.display = "none";
    });

    document.addEventListener("change", (e) => {
      if (e.target.name.startsWith("q")) {
        nextBtn.disabled = false;
      }
    });

    renderQuestions();
    updateQuestion(currentQuestionIndex);
  </script>
</body>
</html>
